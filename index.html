<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيقاتي | روابط التطبيقات</title>
    <!-- استيراد الخطوط والأيقونات -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #38bdf8;
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #ffffff;
        }

        p.bio {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 30px;
        }

        .links-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 15px 20px;
            border-radius: 14px;
            color: #ffffff;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .link-card:hover {
            background: rgba(56, 189, 248, 0.15);
            border-color: #38bdf8;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(56, 189, 248, 0.2);
        }

        .link-card .icon-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            font-size: 16px;
        }

        .link-card i.fa-brands, .link-card i.fa-solid {
            font-size: 20px;
            color: #38bdf8;
        }

        .link-card .fa-arrow-left {
            font-size: 14px;
            color: #64748b;
            transition: transform 0.3s ease;
        }

        .link-card:hover .fa-arrow-left {
            transform: translateX(-5px);
            color: #38bdf8;
        }

        footer {
            margin-top: 30px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- صورة الملف الشخصي -->
        <img src="https://via.placeholder.com/150" alt="صورة الملف الشخصي" class="profile-img">
        
        <h1>تطبيقاتي ومشاريعي</h1>
        <p class="bio">استكشف أحدث التطبيقات والمشاريع البرمجية</p>

    <!-- قائمة الروابط -->
        <div class="links-list">
            <!-- رابط وزاري باث -->
            <a href="ضع_رابط_وزاري_باث_هنا" target="_blank" class="link-card">
                <div class="icon-title">
                    <i class="fa-solid fa-graduation-cap"></i>
                    <span>تطبيق وزاري باث (WizariPath)</span>
                </div>
                <i class="fa-solid fa-arrow-left"></i>
            </a>

            <!-- رابط سطور -->
            <a href="ضع_رابط_سطور_هنا" target="_blank" class="link-card">
                <div class="icon-title">
                    <i class="fa-solid fa-file-lines"></i>
                    <span>تطبيق سطور (Sutoor)</span>
                </div>
                <i class="fa-solid fa-arrow-left"></i>
            </a>

            <!-- رابط إضافي (مثلاً قناتك على يوتيوب) -->
            <a href="https://www.youtube.com/@yourchannel" target="_blank" class="link-card">
                <div class="icon-title">
                    <i class="fa-brands fa-youtube"></i>
                    <span>قناتي التعليمية على يوتيوب</span>
                </div>
                <i class="fa-solid fa-arrow-left"></i>
            </a>
        </div>

        <footer>
            جميع الحقوق محفوظة &copy; 2026
        </footer>
    </div>

</body>
</html>
